# models.yaml — model id -> {provider, ctx, price_in, price_out, tier, good_at[]} (docs/25 §2).
# price_in/price_out are USD per million tokens (docs/22). tier: free | paid.
# REMOTE-FIRST default posture (docs/20): free cloud tiers behind the Router; only
# embeddings run locally. The `free` profile and the routes default reference free tier only.
"llama3.1:8b":  # Ollama's real model string (name:tag); quoted — the colon is YAML-significant
  provider: ollama
  ctx: 8192
  price_in: 0.0
  price_out: 0.0
  tier: free
  good_at: [draft, classify, summarize]
"qwen3:8b":  # Ollama's real model string (name:tag); quoted — the colon is YAML-significant.
  # family "qwen" (derived): a DIFFERENT family from every llama producer, so a local critic
  # on this model satisfies INV-WF-2 tier 1 without any cloud dependency.
  # ctx is the conservative locally-SERVED window, matching the llama3.1:8b convention — the
  # model's own maximum is far larger, but Ollama serves a small default num_ctx unless the
  # request sets options.num_ctx (a transport change, not config; not done here). Declaring
  # the honest served figure keeps the router from sending a long prompt to be truncated.
  provider: ollama
  ctx: 8192
  price_in: 0.0
  price_out: 0.0
  tier: free
  good_at: [critique, reasoning, draft]
llama-3.3-70b-versatile:  # Groq's real API model string (docs/22; sent verbatim to the API)
  provider: groq
  ctx: 131072
  price_in: 0.0
  price_out: 0.0
  tier: free
  good_at: [reasoning, draft, tools]
gemini-2.0-flash:
  provider: gemini
  ctx: 1000000
  price_in: 0.0
  price_out: 0.0
  tier: free
  good_at: [reasoning, web, long-context]
deepseek-chat-free:
  provider: openrouter
  ctx: 65536
  price_in: 0.0
  price_out: 0.0
  tier: free
  good_at: [reasoning, critique]
claude-sonnet:
  provider: openrouter
  ctx: 200000
  price_in: 3.0
  price_out: 15.0
  tier: paid
  good_at: [reasoning, critique, builder]

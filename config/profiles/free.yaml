# profiles/free.yaml — the default zero-cost posture (docs/20): free cloud tiers + local
# embeddings only, no paid dependency. Reaffirms the free-tier routing defaults so a
# `free` load is explicit and self-documenting. The monthly cap is $0, so the router's
# budget guard (router/budget.py tier_ceiling: spend >= 0.8 * monthly_usd => "free") sits
# at/over threshold from the first call and hard-refuses every paid-tier model — defense
# in depth atop the already-all-free routes. (send_daily kept at the base 40; unrelated.)
budgets:
  monthly_usd: 0.0
  on_exceeded: degrade
  send_daily: 40
# Providers: Gemini + Groq + local Ollama only — no OpenRouter, no 4th provider.
# The Critic sits on a DIFFERENT family (gemini) from the llama-family producers
# (reasoning/draft/classify on Groq-Llama + local Llama), so INV-WF-2's cross-family
# critic verification holds at tier 1. gemini is the only non-llama free model, so the
# Critic route carries no same-family fallback — router exhaustion degrades through the
# framework's INV-WF-2 ladder (same-family, then the always-available tier-3 checklist).
routes:
  reasoning:
    primary: llama-3.3-70b-versatile
    fallback: [gemini-2.0-flash]
    min_ctx: 32000
  critic:
    primary: gemini-2.0-flash
    fallback: []

# profiles/local-first.yaml — maximum privacy / offline posture (docs/20): keep every
# role on the local Ollama model where possible; free cloud only as a fallback. Useful
# when a context carries PII (contains_pii hard-blocks cloud adapters anyway, INV-PII-3).
routes:
  reasoning:
    primary: "llama3.1:8b"
    fallback: [llama-3.3-70b-versatile]
    min_ctx: 8000
  classify:
    primary: "llama3.1:8b"
    fallback: []
  draft:
    primary: "llama3.1:8b"
    fallback: []
  critic:
    primary: "llama3.1:8b"
    fallback: [deepseek-chat-free]

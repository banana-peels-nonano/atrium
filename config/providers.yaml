# providers.yaml — provider -> {base_url, key_env, kind} (docs/25 §2).
# key_env names the environment variable holding the key; the SECRET VALUE never lives
# here (docs/24). The Router reads the key from env at call time.
ollama:
  base_url: http://localhost:11434/v1
  key_env: OLLAMA_HOST
  kind: local
openrouter:
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY
  kind: cloud
groq:
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_API_KEY
  kind: cloud
gemini:
  # Native Gemini REST base — the shim posts to {base}/models/{model}:generateContent.
  base_url: https://generativelanguage.googleapis.com/v1beta
  key_env: GEMINI_API_KEY
  kind: cloud

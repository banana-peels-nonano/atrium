[project]
name = "charterhouse"
version = "0.0.0"
description = "Charter House — a deterministic solo-founder startup factory (Implementation Bible build)."
requires-python = ">=3.13"
# Runtime dependencies are added per subsystem in later phases, pinned for reproducibility.
dependencies = [
    "lancedb==0.34.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charterhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail closed: an empty suite is a configuration error, not a pass, once tests exist.
addopts = "-q"

# uv draws from the shared K: cache (UV_CACHE_DIR); the project venv (.venv) is
# gitignored and never re-downloads packages already present in the shared cache.
[tool.uv]
managed = true
